name: Test Remember RP update

on:
  workflow_dispatch:
    inputs:
      test_version:
        description: "Test version (use a new version, e.g. 0.1.3)"
        required: true
        default: "0.1.3"

permissions:
  contents: write

concurrency:
  group: remember-rp-test-release
  cancel-in-progress: false

jobs:
  test-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download MiNT runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download runtime-assets --repo ColinsBlares/launcher --pattern mint-runtime.zip --dir .
          if (!(Test-Path "mint-runtime.zip")) { throw "mint-runtime.zip missing from runtime-assets" }
          Expand-Archive -Path "mint-runtime.zip" -DestinationPath "." -Force
          if (!(Test-Path "mint-runtime/client/Launcher.exe")) { throw "Runtime archive must contain mint-runtime/client/Launcher.exe" }

      - name: Set test version and prevent release overwrite
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.test_version }}"
          if ($version -notmatch '^0\.1\.\d+$') { throw "Use a test version like 0.1.3" }
          $tag = "v$version"
          gh release view $tag --repo ColinsBlares/launcher *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Choose a new version; existing release assets will not be overwritten." }
          $LASTEXITCODE = 0
          npm version $version --no-git-tag-version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Build NSIS installer without publishing
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer and SHA512 manifest
        shell: pwsh
        run: |
          $version = "${{ inputs.test_version }}"
          $installer = "release/Remember-RP-$version-Setup.exe"
          $manifest = "release/latest.yml"
          $blockmap = "$installer.blockmap"
          foreach ($file in @($installer, $manifest, $blockmap)) {
            if (!(Test-Path $file)) { throw "Required release file not found: $file" }
          }
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const installer = process.argv[1];
            const manifestPath = process.argv[2];
            const manifest = fs.readFileSync(manifestPath, "utf8");
            const match = manifest.match(/^\\s{4}sha512:\\s*(\\S+)/m);
            if (!match) throw new Error("Could not find file sha512 in latest.yml");
            const actual = crypto.createHash("sha512").update(fs.readFileSync(installer)).digest("base64");
            if (actual !== match[1]) throw new Error("SHA512 mismatch between installer and latest.yml");
            console.log("SHA512 verified: installer matches latest.yml");
          ' "$installer" "$manifest"

      - name: Publish a new immutable test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.test_version }}"
          $tag = "v$version"
          gh release create $tag `
            "release/Remember-RP-$version-Setup.exe" `
            "release/Remember-RP-$version-Setup.exe.blockmap" `
            "release/latest.yml" `
            --repo ColinsBlares/launcher `
            --title "Remember RP $version" `
            --notes "Тестовое обновление Remember RP. Файлы опубликованы одним комплектом после проверки SHA512."
