
name: Remember RP - Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare MiNT runtime directory
        shell: pwsh
        run: |
          if (!(Test-Path "mint-runtime")) {
            New-Item -ItemType Directory -Path "mint-runtime" | Out-Null
          }

      - name: Build application
        run: npm run build

      - name: Publish Windows installer
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
