name: Build and publish Remember RP

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: remember-rp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (node -p "require('./package.json').version").Trim()
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Git tag ${{ github.ref_name }} does not match package.json version v$packageVersion"
          }

      - name: Download MiNT runtime package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download runtime-assets --repo ColinsBlares/launcher --pattern mint-runtime.zip --dir .
          if (!(Test-Path "mint-runtime.zip")) { throw "mint-runtime.zip was not downloaded from the runtime-assets release" }
          Expand-Archive -Path "mint-runtime.zip" -DestinationPath "." -Force
          if (!(Test-Path "mint-runtime/client/Launcher.exe")) { throw "MiNT runtime archive must contain client/Launcher.exe" }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
